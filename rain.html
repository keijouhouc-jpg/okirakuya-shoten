<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨の部屋</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{min-width:320px;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;justify-content:center;color:#fff1cf;background:#120c08 url("rain-new-approved.webp") center center/cover no-repeat;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(8,7,10,.34),transparent 38%,rgba(8,6,5,.3));}
.intro{position:absolute;z-index:1;top:clamp(24px,6vh,64px);left:50%;width:min(88%,560px);transform:translateX(-50%);text-align:center;text-shadow:0 2px 10px rgba(9,6,5,.92);pointer-events:none;}
.intro h1{font-size:clamp(22.68px,4.86vw,35.64px);font-weight:500;letter-spacing:.18em;}
.intro p{margin-top:10px;font-size:clamp(11.34px,3.078vw,14.58px);line-height:1.75;letter-spacing:.06em;transform:translateY(-20px);}
.controls{position:absolute;z-index:1;bottom:3%;left:50%;display:flex;flex-direction:column;align-items:center;gap:16px;width:300px;transform:translateX(-50%);}
.btn{width:180px;min-height:40px;padding:10px 18px;border:1px solid rgba(255,241,207,.24);border-radius:999px;color:#fff;background:rgba(255,255,255,.03);backdrop-filter:blur(6px);font:16px/1.2 "Yu Mincho","Hiragino Mincho ProN",serif;cursor:pointer;touch-action:manipulation;transition:background .2s ease;}
.btn:hover,.btn:focus-visible{background:rgba(255,255,255,.06);}.btn:focus-visible{outline:2px solid #fff1cf;outline-offset:3px;}
@media (max-width:700px), (hover:none) and (pointer:coarse){
  body{background:#0c1b2b;}
  body::before{z-index:0;display:block;background:#0c1b2b url("assets/rain-mobile-garden.png") center center/cover no-repeat;}
  body::after{display:none;}
  .btn,.btn:hover,.btn:focus-visible{background:transparent;backdrop-filter:none;}.btn:active{background:transparent;backdrop-filter:none;border-color:#fff1cf;box-shadow:0 0 0 2px rgba(255,241,207,.25);transform:scale(.98);}
  .intro{top:28px;}.intro h1{font-size:26px;}.intro p{font-size:13.5px;transform:translateY(-2px);}
}
@media (min-width:701px){.btn,.btn:hover,.btn:focus-visible,.btn:active{background:transparent;backdrop-filter:none;}#rainToggle{transform:translateY(10px);}}
@media (prefers-reduced-motion:reduce){.btn{transition:none;}}
</style>
</head>
<body>
<header class="intro"><h1>雨の部屋</h1><p>雨音に包まれて、心ほどけるひとときを。</p></header>
<div class="controls"><button class="btn" id="rainToggle" type="button" aria-pressed="false">☔ 雨音を流す</button><button class="btn" type="button" onclick="location.href='menu.html'">← 店内へ戻る</button></div>
<audio id="rainSound" loop><source src="rain.mp3" type="audio/mpeg"></audio>
<script>
const rain=document.getElementById("rainSound");const rainToggle=document.getElementById("rainToggle");
function updateRainToggle(){const isPlaying=!rain.paused;rainToggle.textContent=isPlaying?"🔇 音を止める":"☔ 雨音を流す";rainToggle.setAttribute("aria-pressed",String(isPlaying));}
async function toggleRain(){if(rain.paused){try{await rain.play();}catch(error){console.log(error);}}else{rain.pause();rain.currentTime=0;}updateRainToggle();}
rainToggle.addEventListener("click",toggleRain);rain.addEventListener("play",updateRainToggle);rain.addEventListener("pause",updateRainToggle);
</script>
</body>
</html>
