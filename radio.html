<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>深夜ラジオ</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

body{

  height:100vh;

  background:
  url("radio.png")
  center center/cover no-repeat;

  display:flex;
  justify-content:center;
  align-items:center;

  font-family:sans-serif;

  overflow:hidden;
}

/* ボタンエリア */

.controls{
position:absolute;

/* 下へ移動 */
bottom:2%;

display:flex;
flex-direction:column;
gap:16px;

/* 横幅を短く */
width:36%;
min-width:300px;
max-width:420px;

left:50%;
transform:translateX(-50%);
}

.btn{

width: 200px;

border:none;
border-radius:999px;

/* 縦幅を少し短く */
padding: 10px 18px;

font-size:16px;

cursor:pointer;

color:white;

background:rgba(255,255,255,.18);

backdrop-filter:blur(6px);

transition:.2s;
}


.btn:hover{
  background:rgba(255,255,255,.28);
}

</style>
</head>

<body>

<div class="controls">

<button
class="btn"
onclick="playRadio()">
📻 ラジオを流す
</button>

<button
class="btn"
onclick="stopRadio()">
🔇 音を止める
</button>

<button
class="btn"
onclick="location.href='menu.html'">
← メニューへ戻る
</button>

</div>

<audio id="radioSound" loop>
<source src="radio.aac" type="audio/mpeg">
</audio>

<script>

const radio =
document.getElementById("radioSound");

function playRadio(){

  radio.play().catch(error=>{
    console.log(error);
  });

}

function stopRadio(){

  radio.pause();
  radio.currentTime = 0;

}

</script>

</body>
</html>
