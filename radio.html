<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>深夜ラジオ</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

body{

  height:100vh;

  background:
  url("radio.png")
  center center/cover no-repeat;

  display:flex;
  justify-content:center;
  align-items:center;

  font-family:sans-serif;

  overflow:hidden;
}

/* ボタンエリア */

.controls{

  position:absolute;

  bottom:8%;

  display:flex;
  flex-direction:column;
  gap:18px;

  width:70%;
  max-width:560px;
}

/* ボタン */

.btn{

  width:100%;

  border:none;

  border-radius:999px;

  padding:22px;

  font-size:20px;

  cursor:pointer;

  color:white;

  background:rgba(255,255,255,.18);

  backdrop-filter:blur(6px);

  transition:.2s;
}

.btn:hover{
  background:rgba(255,255,255,.28);
}

</style>
</head>

<body>

<div class="controls">

<button
class="btn"
onclick="playRadio()">
📻 ラジオを流す
</button>

<button
class="btn"
onclick="stopRadio()">
🔇 音を止める
</button>

<button
class="btn"
onclick="location.href='menu.html'">
← メニューへ戻る
</button>

</div>

<audio id="radioSound" loop>
<source src="radio.mp3" type="audio/mpeg">
</audio>

<script>

const radio =
document.getElementById("radioSound");

function playRadio(){

  radio.play().catch(error=>{
    console.log(error);
  });

}

function stopRadio(){

  radio.pause();
  radio.currentTime = 0;

}

</script>

</body>
</html>
