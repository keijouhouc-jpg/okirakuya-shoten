<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お気楽屋商店</title>

  <style>
  body{
  margin:0;
  min-height:100vh;

  background:#000;

  display:flex;
  justify-content:center;
  align-items:center;
}

#bg{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;

  z-index:1;
}

.box{
  position:relative;
  z-index:10;
}
   button {
  display: block;

  width: 200px;

  margin: 12px auto;

  padding: 10px 18px;

  border: none;
  border-radius: 999px;

  background: rgba(255,255,255,0.2);

  color: white;

  font-size: 16px;

  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;

  transition: all 0.3s ease;
}

  button:hover{
  background: rgba(255,255,255,0.3);
  transform: scale(1.03);
}
  </style>
</head>

<body>

  <img id="bg" src="shop.png" alt="">
  
  <div class="box">

<button onclick="playMusic('un02.aac')">
  今月の曲
</button>

<button onclick="playMusic('te.mp3')">
  テーマ曲
</button>

<button onclick="playMusic('end.mp3')">
  エンディング曲
</button>

<br><br>

<button onclick="stopMusic()">
  音を止める
</button>

<button
class="enter-btn"
onclick="location.href='menu.html'">
🏮 店に入る
</button>
    
  </div>

 <audio id="bgm" ></audio>

 <script>

const audio = document.getElementById('bgm');

function playMusic(song) {

  audio.src = song;
  audio.load();
  audio.play().catch(error => {
  console.log(error);
});

}

function stopMusic() {

  audio.pause();

}

</script>

</body>
</html>
