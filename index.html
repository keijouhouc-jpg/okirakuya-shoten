<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お気楽屋商店</title>

  <style>
  body{
  margin:0;
  min-height:100vh;

  background:#000;

  display:flex;
  justify-content:center;
  align-items:center;
}

#bg{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  z-index:1;
}

.box{
  width:90%;
  max-width:320px;

  text-align:center;

  position:relative;
  z-index:10;

  margin-top:150px;
}
   .box{
  width:90%;
  max-width:320px;

  text-align:center;

  position:relative;
  z-index:10;

  margin-top:250px;
}

    button{
  display:block;
  width:220px;

  margin:12px auto;
  padding:12px 18px;

  border:none;
  border-radius:999px;

  background:rgba(0,0,0,0.35);

  color:white;
  font-size:16px;

  cursor:pointer;

  backdrop-filter:blur(3px);

  transition:all .3s ease;
}

.enter-btn{
  width:260px;
  padding:16px 20px;

  font-size:20px;
  font-weight:bold;

  background:rgba(255,255,255,0.25);
}
    
  button:hover{
  background: rgba(255,255,255,0.3);
  transform: scale(1.03);
}
  </style>
</head>

<body>

  <img id="bg" src="shop.png" alt="">
  
  <div class="box">

<button onclick="playMusic('un02.aac')">
  今月の曲
</button>

<button onclick="playMusic('te.mp3')">
  テーマ曲
</button>

<button onclick="playMusic('end.mp3')">
  エンディング曲
</button>

<br><br>

<button onclick="stopMusic()">
  音を止める
</button>

<button
class="enter-btn"
onclick="location.href='menu.html'">
🏮 店に入る
</button>

</div>

 <audio id="bgm" ></audio>

 <script>

const audio = document.getElementById('bgm');

function playMusic(song) {

  audio.src = song;
  audio.load();
  audio.play().catch(error => {
  console.log(error);
});

}

function stopMusic() {

  audio.pause();

}

</script>

</body>
</html>
