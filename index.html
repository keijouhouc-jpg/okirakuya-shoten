<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お気楽屋商店</title>

  <style>
    body {
  margin: 0;
  height: 100vh;
  background-image: url('shop.png');
  background-size: cover;
  background-position: center top;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: sans-serif;
  color: white;

  touch-action: manipulation;
  overflow: hidden;
}

  .box {
  padding: 30px;
  text-align: center;

  width: 90%;
  max-width: 320px;
  margin: auto;

  position: relative;
  z-index: 10;
}
   button {
  display: block;

  width: 220px;

  margin: 12px auto;

  padding: 12px 20px;

  border: none;
  border-radius: 999px;

  background: rgba(255,255,255,0.2);

  color: white;

  font-size: 17px;

  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;

  transition: all 0.3s ease;
}

  button:hover{
  background: rgba(255,255,255,0.3);
  transform: scale(1.03);
}
  </style>
</head>

<body>

  <div class="box">
    <h1>お気楽屋商店</h1>

    <p>
      今日は、何もしない。<br>
    </p>

<button onclick="playMusic('un02.aac')">
  今月の曲
</button>

<button onclick="playMusic('te.mp3')">
  テーマ曲
</button>

<button onclick="playMusic('end.mp3')">
  エンディング曲
</button>

<br><br>

<button onclick="stopMusic()">
  音を止める
</button>

<button
class="enter-btn"
onclick="location.href='menu.html'">
🏮 店に入る
</button>
    
  </div>

 <audio id="bgm" ></audio>

 <script>

const audio = document.getElementById('bgm');

function playMusic(song) {

  audio.src = song;
  audio.load();
  audio.play().catch(error => {
  console.log(error);
});

}

function stopMusic() {

  audio.pause();

}

</script>

</body>
</html>
