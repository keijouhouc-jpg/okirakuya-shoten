<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お気楽屋商店街の夕方</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:sans-serif;
}

/* 空 */
.sky{
    position:absolute;
    width:100%;
    height:100%;
    background:
    linear-gradient(
    to bottom,
    #ffb36b 0%,
    #ff8e72 40%,
    #6d5ca8 100%);
}

/* 太陽 */
.sun{
    position:absolute;
    width:120px;
    height:120px;
    border-radius:50%;
    background:#ffd76a;
    left:50%;
    top:15%;
    transform:translateX(-50%);
    box-shadow:0 0 50px rgba(255,215,106,.8);
}

/* 遠景 */
.mountains{
    position:absolute;
    bottom:220px;
    width:100%;
    height:200px;
    background:
    linear-gradient(
    to top,
    #5c5470,
    #7b7395);
    clip-path:polygon(
    0 100%,
    10% 60%,
    20% 80%,
    35% 40%,
    50% 75%,
    65% 35%,
    80% 80%,
    100% 50%,
    100% 100%);
}

/* 商店街 */
.street{
    position:absolute;
    bottom:0;
    width:100%;
    height:220px;
    background:#444;
}

/* 店 */
.shop{
    position:absolute;
    bottom:220px;
    width:180px;
    height:160px;
    background:#d8c5a3;
    border:3px solid #444;
}

.shop::before{
    content:"";
    position:absolute;
    width:100%;
    height:40px;
    background:#c44;
    top:0;
    left:0;
}

.shop1{left:5%;}
.shop2{left:28%;}
.shop3{left:51%;}
.shop4{left:74%;}

/* 窓 */
.window{
    position:absolute;
    width:50px;
    height:50px;
    background:#ffd86e;
    top:65px;
}

.w1{left:20px;}
.w2{right:20px;}

/* 街灯 */
.lamp{
    position:absolute;
    bottom:220px;
    width:8px;
    height:140px;
    background:#333;
}

.lamp::before{
    content:"";
    position:absolute;
    width:35px;
    height:35px;
    border-radius:50%;
    background:#ffe08a;
    top:-20px;
    left:-13px;
    box-shadow:0 0 25px #ffe08a;
}

.l1{left:18%;}
.l2{left:50%;}
.l3{left:82%;}

/* タイトル */
.title{
    position:absolute;
    width:100%;
    text-align:center;
    top:30px;
    color:white;
    font-size:2rem;
    text-shadow:2px 2px 8px rgba(0,0,0,.5);
}

.sub{
    font-size:1rem;
    margin-top:10px;
}

</style>
</head>
<body>

<div class="sky"></div>
<div class="sun"></div>
<div class="mountains"></div>

<div class="title">
    お気楽屋商店街
    <div class="sub">
        夕暮れのんびり時間
    </div>
</div>

<div class="shop shop1">
    <div class="window w1"></div>
    <div class="window w2"></div>
</div>

<div class="shop shop2">
    <div class="window w1"></div>
    <div class="window w2"></div>
</div>

<div class="shop shop3">
    <div class="window w1"></div>
    <div class="window w2"></div>
</div>

<div class="shop shop4">
    <div class="window w1"></div>
    <div class="window w2"></div>
</div>

<div class="lamp l1"></div>
<div class="lamp l2"></div>
<div class="lamp l3"></div>

<div class="street"></div>

</body>
</html>
