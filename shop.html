<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店内の様子</title>
<style>
:root{color:#f6ead2;background:#21150f;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;}
*{box-sizing:border-box;}body{min-width:320px;min-height:100vh;min-height:100svh;margin:0;background:radial-gradient(circle at top,#55331e,#21150f 68%);}.page{width:min(100% - 32px,980px);margin:0 auto;padding:clamp(24px,5vw,52px) 0 36px;}.intro{margin-bottom:18px;text-align:center;text-shadow:0 2px 8px #160b06;}h1{margin:0;font-size:clamp(28px,6vw,42px);font-weight:500;letter-spacing:.16em;}.clock{display:block;margin-top:9px;color:#ead5b3;font-family:"Yu Gothic","Hiragino Sans",sans-serif;font-size:clamp(13px,3.5vw,16px);}.scene{overflow:hidden;background:#160d09;border:1px solid rgba(255,235,195,.18);border-radius:18px;box-shadow:0 14px 38px rgba(0,0,0,.35);}.scene img{display:block;width:100%;height:auto;aspect-ratio:3 / 2;}.copy{padding:clamp(20px,5vw,34px);text-align:center;background:rgba(25,14,9,.76);}.copy h2{margin:0;color:#fff1cf;font-size:clamp(22px,5vw,31px);font-weight:500;letter-spacing:.1em;}.copy p{margin:11px 0 0;color:#eadcc6;font-size:clamp(14px,3.8vw,17px);line-height:1.8;}.preview-controls{margin-top:22px;padding:18px;border:1px solid rgba(255,235,195,.15);border-radius:14px;background:rgba(25,14,9,.45);}.preview-controls h2{margin:0;color:#fff1cf;font-size:18px;font-weight:500;text-align:center;}.preview-controls p{margin:6px 0 14px;color:#eadcc6;font-size:14px;text-align:center;}.time-buttons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;}.time-buttons button{min-height:44px;padding:9px 10px;color:#fff1cf;border:1px solid rgba(255,241,207,.28);border-radius:10px;background:rgba(255,255,255,.03);font:inherit;cursor:pointer;touch-action:manipulation;}.time-buttons button:hover,.time-buttons button[aria-pressed="true"]{background:rgba(255,241,207,.16);}.time-buttons button:focus-visible{outline:2px solid #fff1cf;outline-offset:3px;}.return{display:flex;justify-content:center;margin-top:24px;}.return a{min-height:44px;padding:11px 20px;color:#fff1cf;border:1px solid rgba(255,241,207,.28);border-radius:999px;background:rgba(255,255,255,.03);font-size:16px;line-height:1.25;text-decoration:none;}.return a:hover{background:rgba(255,255,255,.1);}.return a:focus-visible{outline:2px solid #fff1cf;outline-offset:3px;}
@media (min-width:681px){.page{width:min(100% - 32px,860px);padding-top:24px;}.time-buttons{position:fixed;z-index:2;bottom:0;left:50%;width:min(100% - 32px,860px);padding:10px;transform:translateX(-50%);border:1px solid rgba(255,235,195,.18);border-radius:14px 14px 0 0;background:rgba(25,14,9,.88);box-shadow:0 8px 28px rgba(0,0,0,.34);}.return{padding-bottom:86px;}}
@media (max-width:680px){.page{width:min(100% - 24px,980px);padding-top:28px;}.scene{border-radius:12px;}.preview-controls{padding:16px 12px;}.time-buttons{grid-template-columns:repeat(2,minmax(0,1fr));}.time-buttons [data-auto]{grid-column:1 / -1;}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;}}
</style>
</head>
<body>
<main class="page"><header class="intro"><h1>店内の様子</h1><time class="clock" id="clock" aria-live="polite">ただいま --:--</time></header><article class="scene"><img id="shopImage" src="morning-v2-preview.webp" alt="お気楽屋商店の店内"><div class="copy"><h2 id="sceneTitle">朝の店内</h2><p id="sceneText">店主がそっと掃除をしています。窓を少し開けて、朝の空気を入れました。</p></div></article><section class="preview-controls" aria-labelledby="time-preview-title"><h2 id="time-preview-title">時間帯を確認する</h2><p id="modeStatus" aria-live="polite">現在時刻に合わせて表示中です。</p><div class="time-buttons"><button type="button" data-scene-index="0" aria-pressed="false">朝</button><button type="button" data-scene-index="1" aria-pressed="false">昼</button><button type="button" data-scene-index="2" aria-pressed="false">夕方</button><button type="button" data-scene-index="3" aria-pressed="false">夜</button><button type="button" data-auto aria-pressed="true">自動に戻す</button></div></section><nav class="return" aria-label="ページ移動"><a href="menu.html">← 店内へ戻る</a></nav></main>
<script>
const scenes=[{image:"morning-v2-preview.webp",title:"朝の店内",text:"店主がそっと掃除をしています。窓を少し開けて、朝の空気を入れました。"},{image:"daytime-v2-preview.webp",title:"昼の店内",text:"扇風機がゆっくり回っています。猫は窓際で昼寝中です。"},{image:"evening-v2-preview.webp",title:"夕方の店内",text:"西日が差し込み、商店街の音が少しだけ聞こえます。"},{image:"night-v2-preview.webp",title:"夜の店内",text:"ラジオだけが小さく鳴っています。外はもう、静かです。"}];let manualScene=null;const clock=document.getElementById("clock"),image=document.getElementById("shopImage"),title=document.getElementById("sceneTitle"),text=document.getElementById("sceneText"),modeStatus=document.getElementById("modeStatus"),sceneButtons=document.querySelectorAll("[data-scene-index]"),autoButton=document.querySelector("[data-auto]");function sceneForHour(hour){if(hour>=5&&hour<11)return scenes[0];if(hour>=11&&hour<17)return scenes[1];if(hour>=17&&hour<21)return scenes[2];return scenes[3];}function showScene(scene){image.src=scene.image;title.textContent=scene.title;text.textContent=scene.text;}function updateButtons(){sceneButtons.forEach(button=>button.setAttribute("aria-pressed",String(manualScene===Number(button.dataset.sceneIndex))));autoButton.setAttribute("aria-pressed",String(manualScene===null));}function updateShop(){const now=new Date(),hour=now.getHours();clock.textContent=`ただいま ${String(hour).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;if(manualScene!==null)return;showScene(sceneForHour(hour));modeStatus.textContent="現在時刻に合わせて表示中です。";updateButtons();}sceneButtons.forEach(button=>button.addEventListener("click",()=>{manualScene=Number(button.dataset.sceneIndex);showScene(scenes[manualScene]);modeStatus.textContent=`${scenes[manualScene].title}を手動で表示中です。`;updateButtons();}));autoButton.addEventListener("click",()=>{manualScene=null;updateShop();});updateShop();window.setInterval(updateShop,60000);
</script>
</body>
</html>
