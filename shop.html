<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>お気楽屋商店 - 店内の様子</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#4a3426;
);
  
color:#f0e6d2;
font-family:"Hiragino Sans","Yu Gothic",sans-serif;
min-height:100vh;
}

header{
padding:20px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.1);
}

header h1{
font-size:28px;
font-weight:300;
letter-spacing:4px;
}

.time{
margin-top:10px;
font-size:14px;
opacity:.7;
}

main{
max-width:1000px;
margin:auto;
padding:20px;
}

.photo{
overflow:hidden;
border-radius:16px;
box-shadow:0 0 30px rgba(0,0,0,.4);
}

.photo img{
width:100%;
display:block;
}

.status{
margin-top:25px;
padding:25px;
background:rgba(255,255,255,.04);
border-radius:16px;
line-height:2;
}

.status h2{
margin-bottom:15px;
font-size:22px;
font-weight:400;
}

.note{
margin-top:30px;
text-align:center;
opacity:.7;
font-size:14px;
}

footer{
margin-top:40px;
padding:20px;
text-align:center;
opacity:.4;
font-size:12px;
}

  .return-shop{
text-align:center;
margin-top:40px;
}

.return-shop a{
display:inline-block;
padding:12px 24px;
color:#f0e6d2;
text-decoration:none;
border:1px solid rgba(255,255,255,.15);
border-radius:999px;
background:rgba(255,255,255,.03);
transition:.3s;
}

.return-shop a:hover{
background:rgba(255,255,255,.08);
transform:translateY(-2px);
}
</style>
</head>
<body>

<header>

<h1>店内の様子</h1>

<div class="time" id="clock">
--:--
</div>

</header>

<main>

<div class="photo">

<!-- ここを画像に差し替える -->
<img id="shopImage" src="shop1.png" alt="お気楽屋商店">
</div>

<div class="status">

<h2 id="todayTitle">
読み込み中...
</h2>

<p id="todayText">
...
</p>

</div>

</div>

<div class="note">

お気楽屋商店は、本日ものんびり営業中です。

</div>
  
<div class="return-shop">
    <a href="index.html">
        そろそろ店先へ戻りますか？
    </a>
</div>
  
</main>

<footer>

何もしない時間をどうぞ。

</footer>

<script>

function updateClock(){

const now = new Date();

const h = now.getHours();
const m = String(now.getMinutes()).padStart(2,"0");

document.getElementById("clock").textContent =
"時刻 : " + h + ":" + m;

updateAtmosphere(h);

}

function updateAtmosphere(hour){

const title =
document.getElementById("todayTitle");

const text =
document.getElementById("todayText");

const image =
document.getElementById("shopImage");
  
if(hour >= 5 && hour < 11){

image.src = "morning.png";

title.textContent = "朝の様子";

text.innerHTML = `
店主が掃除しています。<br>
窓を開けて空気を入れ替えています。<br>
猫はまだ眠そうです。<br>
ラジオはついていません。
`;

}

else if(hour >= 11 && hour < 17){

image.src = "day.png";
  
title.textContent = "昼の様子";

text.innerHTML = `
扇風機が回っています。<br>
猫は窓際で昼寝しています。<br>
店内は静かです。<br>
外から自転車の音が聞こえます。
`;

}

else if(hour >= 17 && hour < 21){

image.src = "evening.png"; 
  
title.textContent = "夕方の様子";

text.innerHTML = `
西日が入っています。<br>
商店街の音が少しだけ聞こえます。<br>
ラジオが小さく流れています。<br>
猫は起きています。
`;

}

else{
  
image.src = "night.png";
  
title.textContent = "深夜の様子";

text.innerHTML = `
ラジオだけが鳴っています。<br>
店内は薄暗いです。<br>
外は静かです。<br>
猫はどこかで寝ています。
`;

}

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>
</html>
