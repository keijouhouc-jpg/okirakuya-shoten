<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{

  height:100vh;

  background:url("relax.png")
  center center/cover no-repeat;

  font-family:sans-serif;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;
}

/* ボタンエリア */

.controls{

  position:absolute;

  bottom:2%;

  width:60%;
  max-width:320px;

  display:flex;
  flex-direction:column;

  gap:14px;
}

/* ボタン */

.btn{

  width:90%;
  max-width:420px;

  border:none;

  border-radius:999px;

  padding:14px 20px;

  font-size:17px;

  color:white;

  cursor:pointer;

  background:rgba(255,255,255,.08);

  border:1px solid rgba(255,255,255,.15);

  backdrop-filter:blur(8px);

  transition:.2s;
}

.btn:hover{
  background:rgba(255,255,255,.14);
}
</style>
</head>

<body>

<div class="controls">

<button
class="btn"
onclick="playRelax()">
☁️ ぼーっとする
</button>

<button
class="btn"
onclick="stopRelax()">
🔇 音を止める
</button>

<button
class="btn"
onclick="location.href='menu.html'">
← メニューへ戻る
</button>

</div>

<audio id="relaxSound" loop>
<source src="relax.aac" type="audio/mpeg">
</audio>

<script>

const relax =
document.getElementById("relaxSound");

function playRelax(){

  relax.play().catch(error=>{
    console.log(error);
  });

}

function stopRelax(){

  relax.pause();
  relax.currentTime = 0;

}

</script>

</body>
</html>
