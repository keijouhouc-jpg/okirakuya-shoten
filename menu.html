<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お気楽屋商店 - 昭和メニュー</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

body{
  background:#1b120c;
  display:flex;
  justify-content:center;
}

.wrapper{
  position:relative;
  width:100%;
  max-width:800px;
}

.menu-image{
  width:100%;
  display:block;
  height:auto;
}

/* クリックエリア */

.room{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:78%;
  cursor:pointer;
  border-radius:20px;
}

.room:hover{
  background:rgba(255,255,255,.08);
}

/* 押せる場所を初めての人にも分かるようにする案内 */
.room,
.back{
  display:flex;
  align-items:center;
  justify-content:center;
}

.guide-label{
  padding:7px 14px;
  border:1px solid rgba(255,245,220,.55);
  border-radius:999px;
  background:rgba(30,18,10,.72);
  color:#fff8e8;
  font-size:clamp(13px, 3.2vw, 20px);
  font-weight:bold;
  line-height:1.25;
  letter-spacing:.04em;
  text-align:center;
  text-shadow:0 1px 2px rgba(0,0,0,.8);
  box-shadow:0 2px 8px rgba(0,0,0,.38);
  pointer-events:none;
}

.back .guide-label{
  padding:5px 10px;
  font-size:clamp(11px, 2.5vw, 15px);
}

@media (max-width:480px){
  .guide-label{
    padding:6px 10px;
  }
}

/* 画像比率に合わせて配置 */

.rain{
  top:18%;
  height:10%;
}

.radio{
  top:33%;
  height:10%;
}

.relax{
  top:48%;
  height:10%;
}

.evening{
  top:63%;
  height:10%;
}

.shop{
  top:78%;
  height:10%;
}

.back{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:92%;
  width:35%;
  height:5%;
  cursor:pointer;
  border-radius:12px;
}

.back:hover{
  background:rgba(255,255,255,.08);
}

</style>
</head>

<body>

<div class="wrapper">

  <img src="menyu1.png" class="menu-image">

  <div class="room rain"
       onclick="location.href='rain.html'"><span class="guide-label">☔ 雨の部屋</span></div>

  <div class="room radio"
       onclick="location.href='radio.html'"><span class="guide-label">📻 深夜ラジオ</span></div>

  <div class="room relax"
       onclick="location.href='relax.html'"><span class="guide-label">☁️ ぼーっとする</span></div>

  <div class="room evening"
       onclick="location.href='ultimate.html'"><span class="guide-label">🌇 商店街の夕方</span></div>

  <div class="room shop"
       onclick="location.href='shop.html'"><span class="guide-label">🏮 店内の様子</span></div>

  <div class="back"
       onclick="location.href='index.html'"><span class="guide-label">← 店先へ戻る</span></div>

</div>

</body>
</html>
