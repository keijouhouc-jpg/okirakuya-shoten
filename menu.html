<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お気楽屋商店 - 昭和メニュー</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

body{
  width:100%;
  min-height:100svh;
  background:#1b120c;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.wrapper{
  position:relative;
  width:100%;
  max-width:800px;
  overflow:hidden;
}

.menu-image{
  width:100%;
  display:block;
  height:auto;
}

/* クリックエリア */

.room{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  display:block;
  width:78%;
  cursor:pointer;
  border-radius:20px;
}

.room:hover{
  background:rgba(255,255,255,.08);
}

/* 画像比率に合わせて配置 */

.rain{
  top:18%;
  height:10%;
}

.radio{
  top:33%;
  height:10%;
}

.relax{
  top:48%;
  height:10%;
}

.evening{
  top:63%;
  height:10%;
}

.shop{
  top:78%;
  height:10%;
}

.back{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  display:block;
  top:92%;
  width:35%;
  height:5%;
  cursor:pointer;
  border-radius:12px;
}

.back:hover{
  background:rgba(255,255,255,.08);
}

.room:focus-visible,
.back:focus-visible{
  outline:2px solid rgba(255,255,255,.9);
  outline-offset:-4px;
}

/* スマホでは画像を画面幅に合わせ、余分なページ幅や黒帯を作らない。 */
@media (max-width:800px){
  .wrapper{
    width:100vw;
    max-width:none;
  }
}

</style>
</head>

<body>

<div class="wrapper">

  <img src="menyu1.png" class="menu-image" alt="今日はどこで過ごしますか。部屋を選ぶメニュー">

  <a class="room rain" href="rain.html" aria-label="雨の部屋へ"></a>

  <a class="room radio" href="radio.html" aria-label="深夜ラジオへ"></a>

  <a class="room relax" href="relax.html" aria-label="ぼーっとする部屋へ"></a>

  <a class="room evening" href="ultimate.html" aria-label="商店街の夕方へ"></a>

  <a class="room shop" href="shop.html" aria-label="店内の様子へ"></a>

  <a class="back" href="index.html" aria-label="店を出る"></a>

</div>

</body>
</html>
