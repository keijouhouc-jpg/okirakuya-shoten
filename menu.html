<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お気楽屋商店 - 昭和メニュー</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
}

.wrapper{
  position:relative;
  max-width:1080px;
  margin:auto;
}

.wrapper img{
  width:100%;
  display:block;
}

/* 共通 */

.room{
  position:absolute;
  left:23%;
  width:62%;
  cursor:pointer;
  border-radius:20px;
}

/* 雨の部屋 */

.rain{
  top:18%;
  height:8%;
}

/* 深夜ラジオ */

.radio{
  top:35%;
  height:8%;
}

/* ぼーっとする部屋 */

.relax{
  top:52%;
  height:8%;
}

/* 商店街の夕方 */

.evening{
  top:69%;
  height:8%;
}

/* 店内の様子 */

.shop{
  top:86%;
  height:8%;
}

/* 店を出る */

.back{
  position:absolute;

  left:35%;
  width:30%;

  top:95%;

  height:4.5%;

  cursor:pointer;

  border-radius:12px;
}

/* デバッグ用
.room,
.back{
  background:rgba(255,0,0,.2);
}
*/

</style>
</head>

<body>

<div class="wrapper">

<img src="menyu1.png" alt="昭和メニュー">

<div class="room rain"
onclick="location.href='rain.html'"></div>

<div class="room radio"
onclick="location.href='radio.html'"></div>

<div class="room relax"
onclick="location.href='relax.html'"></div>

<div class="room evening"
onclick="location.href='evening.html'"></div>

<div class="room shop"
onclick="location.href='shop.html'"></div>

<div class="back"
onclick="location.href='index.html'"></div>

</div>

</body>
</html>
