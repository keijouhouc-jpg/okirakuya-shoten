<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お気楽屋商店 - 昭和メニュー</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    display:flex;
    justify-content:center;
}

.container{
    position:relative;
    width:100%;
    max-width:1080px;
}

.menu-image{
    width:100%;
    display:block;
}

/* 共通クリックエリア */

.room{
    position:absolute;

    left:12%;
    width:76%;

    cursor:pointer;

    border-radius:20px;

    background:rgba(255,0,0,.25);
}
}

/* 雨の部屋 */

.rain{
  top:21.8%;
  height:9.2%;
}

.radio{
  top:37.1%;
  height:9.2%;
}

.relax{
  top:52.3%;
  height:9.2%;
}

.evening{
  top:67.5%;
  height:9.2%;
}

.shop{
  top:82.7%;
  height:9.2%;
}

/* 店を出る */

.back{

    position:absolute;

    left:34%;

    width:32%;

    top:95.0%;

    height:3.8%;

    background:rgba(0,255,0,.35);

    border-radius:12px;

    cursor:pointer;
}

/* 確認用 */

.room:hover,
.back:hover{
    background:rgba(255,255,255,0.12);
}

</style>
</head>

<body>

<div class="container">

<img src="menyu1.png" class="menu-image">

<div class="room rain"
onclick="location.href='rain.html'"></div>

<div class="room radio"
onclick="location.href='radio.html'"></div>

<div class="room relax"
onclick="location.href='relax.html'"></div>

<div class="room evening"
onclick="location.href='evening.html'"></div>

<div class="room shop"
onclick="location.href='shop.html'"></div>

<div class="back"
onclick="location.href='index.html'"></div>

</div>

</body>
</html>
