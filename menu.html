<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お気楽屋商店</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  overflow-y:auto;
}

.wrapper{
  position:relative;
  max-width:1080px;
  margin:auto;
}

.wrapper img{
  width:100%;
  display:block;
}

/* 共通 */

.area{
  position:absolute;
  left:13%;
  width:74%;
  border-radius:20px;
  cursor:pointer;
}

/* 雨 */

.rain{
  top:12%;
  height:10%;
}

/* 深夜ラジオ */

.radio{
  top:27%;
  height:10%;
}

/* ぼーっと */

.relax{
  top:42%;
  height:10%;
}

/* 商店街 */

.evening{
  top:57%;
  height:10%;
}

/* 店内 */

.shop{
  top:72%;
  height:10%;
}

/* 店を出る */

.back{
  position:absolute;
  left:39%;
  width:23%;
  height:5%;
  bottom:3%;
  cursor:pointer;
}

/* 確認用
完成したら削除 */

.area:hover,
.back:hover{
  background:rgba(255,255,255,.08);
}

</style>
</head>

<body>

<div class="wrapper">

<img src="menyu1.png">

<div class="area rain"
onclick="location.href='rain.html'"></div>

<div class="area radio"
onclick="location.href='radio.html'"></div>

<div class="area relax"
onclick="location.href='relax.html'"></div>

<div class="area evening"
onclick="location.href='evening.html'"></div>

<div class="area shop"
onclick="location.href='shop.html'"></div>

<div class="back"
onclick="location.href='index.html'"></div>

</div>

</body>
</html>
