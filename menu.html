<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お気楽屋商店 - 昭和メニュー</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    display:flex;
    justify-content:center;
}

.container{
    position:relative;
    width:100%;
    max-width:1080px;
}

.menu-image{
    width:100%;
    display:block;
}

/* 共通クリックエリア */

.room{
    position:absolute;
    left:22%;
    width:68%;
    cursor:pointer;
    border-radius:20px;

    /* 位置確認後削除 */
    background:rgba(255,0,0,0.3);
}

/* 雨の部屋 */

.rain{
    top:24.4%;
    height:8.7%;
}

/* 深夜ラジオ */

.radio{
    top:39.4%;
    height:8.7%;
}

/* ぼーっとする部屋 */

.relax{
    top:54.5%;
    height:8.7%;
}

/* 商店街の夕方 */

.evening{
    top:69.6%;
    height:8.7%;
}

/* 店内の様子 */

.shop{
    top:84.8%;
    height:8.7%;
}

/* 店を出る */

.back{
    position:absolute;

    left:35%;
    width:30%;

    top:94.2%;
    height:4.2%;

    cursor:pointer;
    border-radius:12px;

    background:rgba(255,255,255,0.03);
}

/* 確認用 */

.room:hover,
.back:hover{
    background:rgba(255,255,255,0.12);
}

</style>
</head>

<body>

<div class="container">

<img src="menyu1.png" class="menu-image">

<div class="room rain"
onclick="location.href='rain.html'"></div>

<div class="room radio"
onclick="location.href='radio.html'"></div>

<div class="room relax"
onclick="location.href='relax.html'"></div>

<div class="room evening"
onclick="location.href='evening.html'"></div>

<div class="room shop"
onclick="location.href='shop.html'"></div>

<div class="back"
onclick="location.href='index.html'"></div>

</div>

</body>
</html>
