<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お気楽屋商店 - 昭和メニュー</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

body{
  background:#1b120c;
  display:flex;
  justify-content:center;
}

.wrapper{
  position:relative;
  width:100%;
  max-width:800px;
}

.menu-image{
  width:100%;
  display:block;
  height:auto;
}

/* クリックエリア */

.room{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:78%;
  cursor:pointer;
  border-radius:20px;
}

.room:hover{
  background:rgba(255,255,255,.08);
}

/* 画像比率に合わせて配置 */

.rain{
  top:18%;
  height:10%;
}

.radio{
  top:33%;
  height:10%;
}

.relax{
  top:48%;
  height:10%;
}

.evening{
  top:63%;
  height:10%;
}

.shop{
  top:78%;
  height:10%;
}

.back{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:92%;
  width:35%;
  height:5%;
  cursor:pointer;
  border-radius:12px;
}

.back:hover{
  background:rgba(255,255,255,.08);
}

</style>
</head>

<body>

<div class="wrapper">

  <img src="menyu1.png" class="menu-image">

  <div class="room rain"
       onclick="location.href='rain.html'"></div>

  <div class="room radio"
       onclick="location.href='radio.html'"></div>

  <div class="room relax"
       onclick="location.href='relax.html'"></div>

  <div class="room evening"
       onclick="location.href='ultimate.html'"></div>

  <div class="room shop"
       onclick="location.href='shop.html'"></div>

  <div class="back"
       onclick="location.href='index.html'"></div>

</div>

</body>
</html>
