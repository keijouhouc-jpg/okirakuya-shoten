<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お気楽屋商店について</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:url("shop.png") center center/cover no-repeat;
  min-height:100vh;
  font-family:sans-serif;
  color:#f5f0e6;
}

.overlay{
  min-height:100vh;
  background:rgba(0,0,0,0.55);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.panel{
  width:100%;
  max-width:700px;
  background:rgba(0,0,0,0.65);
  border-radius:20px;
  padding:30px;
  backdrop-filter:blur(4px);
}

h1{
  text-align:center;
  margin-bottom:25px;
  font-size:2rem;
}

h2{
  margin-top:25px;
  margin-bottom:10px;
  color:#ffd27a;
}

p{
  line-height:1.9;
  margin-bottom:12px;
}

.message{
  text-align:center;
  margin-top:30px;
  font-size:1.1rem;
}

.back-btn{
  display:block;
  width:220px;
  margin:30px auto 0;
  padding:14px;
  text-align:center;
  text-decoration:none;
  background:#d6b36a;
  color:#222;
  font-weight:bold;
  border-radius:999px;
  transition:.3s;
}

.back-btn:hover{
  transform:scale(1.05);
}

@media(max-width:600px){

  .panel{
    padding:20px;
  }

  h1{
    font-size:1.6rem;
  }

}

</style>
</head>

<body>

<div class="overlay">

<div class="panel">

<h1>お気楽屋商店について</h1>

<p>
ようこそ、お気楽屋商店へ。
</p>

<p>
ここは、少しだけ休むための場所です。
</p>

<p>
何かを頑張る必要はありません。
何かを達成する必要もありません。
ただ、好きな部屋で、好きな時間を過ごしてください。
</p>

<h2>雨の部屋</h2>
<p>
雨音を聞きながら過ごす静かな部屋です。
</p>

<h2>深夜ラジオ</h2>
<p>
眠れない夜に寄り添う小さな部屋です。
</p>

<h2>ぼーっとする部屋</h2>
<p>
何もしない時間を楽しむための部屋です。
</p>

<h2>商店街の夕方</h2>
<p>
西日の差し込む懐かしい夕方の風景です。
</p>

<h2>店内の様子</h2>
<p>
お気楽屋商店の日常の風景です。
</p>

<div class="message">

<p>
疲れたら休む。<br>
飽きたら帰る。<br>
また来たくなったら来る。
</p>

<p style="margin-top:15px;">
ごゆっくりどうぞ。
</p>

</div>

<a href="index.html" class="back-btn">
戻る
</a>

</div>

</div>

</body>
</html>
